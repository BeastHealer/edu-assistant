name: edupath-curator

services:
  curator:
    build:
      context: .
      dockerfile: Dockerfile
    image: edupath-curator:latest
    container_name: edupath-curator
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      STREAMLIT_SERVER_PORT: "8501"
    volumes:
      - curator_index:/app/data/chroma
      - curator_analytics:/app/data/analytics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s

  lms-api:
    image: edupath-curator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edupath-lms-api
    command: ["lms"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      LMS_API_HOST: 0.0.0.0
      LMS_API_PORT: "8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  curator_index:
  curator_analytics:
